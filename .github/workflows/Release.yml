name: Release
run-name: "Release #${{ github.run_number }}"

on:
  workflow_call:
    inputs:
      projectname:
        required: true
        type: string
      projectsuffix:
        required: true
        type: string
      tag:
        required: true
        type: string
      rel_type:
        required: true
        type: string
      mcversion:
        required: true
        type: string
      news:
        required: true
        type: string

env:
  MR_PROJECT_ID: "Ds1KOhlV"
  RELEASE_ROOT: "/var/www/releases"

jobs:
  release-github:
    name: GitHub Release
    runs-on: self-hosted
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: /tmp/modpack-builds/CHANGELOG-${{ inputs.projectsuffix }}.md
          files: |
            /tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}.mrpack
            /tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}-Server-Pack.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-modrinth:
    name: Modrinth Release
    runs-on: self-hosted
    steps:
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MR_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            /tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}.mrpack
            /tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}-Server-Pack.zip
          name: ${{ inputs.projectname }} ${{ inputs.projectsuffix }}
          version: ${{ inputs.projectsuffix }}
          version-type: ${{ inputs.rel_type }}
          changelog-file: /tmp/modpack-builds/CHANGELOG-${{ inputs.projectsuffix }}.md
          loaders: fabric
          game-versions: ${{ inputs.mcversion }}

  release-selfhosted:
    name: Self-Hosted Release
    runs-on: self-hosted
    steps:
      - name: Publish to self-hosted server
        run: |
          DEST="${{ env.RELEASE_ROOT }}"
          unlink "$DEST"/latest.mrpack "$DEST"/latest-serverpack.zip 2>/dev/null || true
          rm "$DEST"/latest.json 2>/dev/null || true
 
          cp "/tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}.mrpack"          "$DEST/"
          cp "/tmp/modpack-builds/${{ inputs.projectname }}-${{ inputs.projectsuffix }}-Server-Pack.zip" "$DEST/"
          cp "/tmp/modpack-builds/CHANGELOG-${{ inputs.projectsuffix }}.md"                             "$DEST/"
 
          cd "$DEST"
          ln -sf "${{ inputs.projectname }}-${{ inputs.projectsuffix }}.mrpack" "latest.mrpack"
          ln -sf "${{ inputs.projectname }}-${{ inputs.projectsuffix }}-Server-Pack.zip" "latest-serverpack.zip"

          cat > "$DEST/latest.json" <<EOF
          {
            "projectname": "${{ inputs.projectname }}",
            "version":     "${{ inputs.projectsuffix }}",
            "mcversion":   "${{ inputs.mcversion }}",
            "type":        "${{ inputs.rel_type }}",
            "tag":         "${{ inputs.tag }}",
            "mrpack":      "${{ inputs.projectname }}-${{ inputs.projectsuffix }}.mrpack",
            "serverpack":  "${{ inputs.projectname }}-${{ inputs.projectsuffix }}-Server-Pack.zip",
            "changelog":   "CHANGELOG-${{ inputs.projectsuffix }}.md"
          }
          EOF
 
          echo "Published to $DEST"
          ls -lh "$DEST"

  update-changelogs:
    name: Update Changelogs
    runs-on: self-hosted
    needs: [release-github, release-modrinth, release-selfhosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive changelog
        run: |
          mkdir -p .github/changelogs
          cp /tmp/modpack-builds/CHANGELOG-${{ inputs.projectsuffix }}.md .github/changelogs/

      - name: Reset CHANGELOG.md from template
        run: cp .github/CHANGELOG_TEMPLATE.md CHANGELOG.md

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/changelogs/ CHANGELOG.md
          git commit -m "chore: archive changelogs for ${{ inputs.projectsuffix }}"

      - name: Push
        uses: ad-m/github-push-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [update-changelogs]
    if: always()
    steps:
      - name: Remove staging directory
        run: rm -rf /tmp/modpack-builds